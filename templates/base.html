<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sync Doctor{% endblock %} · 1Now</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="logo">1Now</span> Sync Doctor</a>
    <nav>
      <a href="{{ url_for('index') }}">Diagnose</a>
      <a href="{{ url_for('tickets') }}">Support tickets</a>
      <form method="post" action="{{ url_for('reset') }}" class="inline"
            onsubmit="return confirm('Reset all demo data (tickets, syncs, runs)?')">
        <button class="link">Reset demo data</button>
      </form>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Prototype. All Turo and 1Now data is mocked. Simulated time: {{ now.strftime('%b %d, %Y %H:%M') }} UTC.</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
